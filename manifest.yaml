# IKEA IROS Assembly Challenge — submission manifest
# Team ManipURL · Unitree G1 EDU (Dex1-1) · https://github.com/RooibosT/ManipURL_IKEA
#
# The digests below were written by scripts/build_and_push.sh from what the
# registry returned, for images built on our own Thor (JetPack 7.1, CUDA 13.0)
# and Orin NX (L4T R35.3.1) -- the same builds every measurement in this file
# came from. Rebuilding from the same Dockerfile would not reproduce these
# bytes: uv and apt both resolve against the network, so the digest, not the
# recipe, is what pins what you run.
#
# Open questions we would like answered are in INSTRUCTIONS.md; every one of
# them is a flag or a declaration, so an answer costs us no rebuild.

lane: decoupled
# Not a preference. Our policy is GR00T N1.7 finetuned under the
# `new_embodiment` tag and it emits joint targets, not a 64-dim SONIC latent,
# so `decoupled` is the only lane it can speak. Both components/server.py and
# components/client.py refuse to start on `sonic` rather than be quietly wrong.

images:
  thor:
    role: policy server
    base_image: nvcr.io/nvidia/cuda:13.0.0-devel-ubuntu24.04
    # The README's Thor row names this NGC CUDA image rather than an l4t-* tag,
    # because JetPack 7 uses unified Arm CUDA. That differs from the onboarding
    # note's "nvcr.io/nvidia/l4t-*" wording; we followed the README, which is
    # the newer of the two. Say so if you want the l4t-* form instead.
    target_arch: aarch64
    target_sm: sm_110          # Blackwell
    dockerfile: docker/Dockerfile.thor
    image: ghcr.io/rooibost/manipurl-thor:v1
    digest: sha256:6cf2039c06ec1c039a0825ecbfb5fcdcbe690e40af4740d2593e83234948d1c5
    entrypoint:
      - python
      - components/server.py
      - --lane
      - decoupled
      - --port
      - "8765"
    # Full `docker run` line, including mounts and env: INSTRUCTIONS.md §1.

  orin:
    role: policy client
    base_image: nvcr.io/nvidia/l4t-jetpack:r35.3.1
    # Must match the Orin's installed L4T exactly (R35.3.1 / JetPack 5.1.1) --
    # the CUDA and driver userspace are mounted from the host at runtime.
    target_arch: aarch64
    target_sm: sm_87           # Ampere. The client does no inference; nothing
                               # in this image is compiled for the GPU.
    dockerfile: docker/Dockerfile.orin
    image: ghcr.io/rooibost/manipurl-orin:v1
    digest: sha256:44015fc48016e3a406ac1025550a06ad3c7deaad796ad6c254f9181fdb422dc9
    entrypoint:
      - python3
      - components/client.py
      - --lane
      - decoupled
      - --thor
      - 192.168.100.1

# Our Thor <-> Orin link. WebSocket carrying msgpack, entirely inside the
# submission: the organizer never speaks it. The client dials the Thor.
thor_orin_port: 8765

weights:
  uri: hf://URL-RFM/gr00t-n1.7-g1-dex1-ikea-3task-46d-30hz-h40
  url: https://huggingface.co/URL-RFM/gr00t-n1.7-g1-dex1-ikea-3task-46d-30hz-h40
  # NOT baked into the image. Mounted read-only at /weights; see INSTRUCTIONS.md.
  visibility: public
  gated: false
  license: apache-2.0
  access: >-
    NOTHING IS NEEDED FROM YOU for this repo. It is public, ungated and
    apache-2.0: the `hf download` line in INSTRUCTIONS.md works with no
    account, no token and no access request. (Our previous submission listed a
    private repo here and asked you for usernames; that ask is withdrawn.) The
    VLM backbone below is still gated and still needs one click.
  # SECOND GATED DEPENDENCY, and the one that is easy to miss. Every GR00T
  # checkpoint -- ours and the base model alike -- loads its VLM backbone from
  # Hugging Face at model-load time. It is not inside our checkpoint and not
  # baked into the image.
  backbone:
    repo: nvidia/Cosmos-Reason2-2B
    url: https://huggingface.co/nvidia/Cosmos-Reason2-2B
    download_gb: 4.9
    gated: true
    access: >-
      Public but gated, with automatic approval: open the URL, accept the terms,
      and access is granted immediately -- no request queue. Then either
      pre-stage it into the weights mount so the container needs no network at
      run time (HF_HUB_CACHE=/opt/weights/hf-cache/hub hf download
      nvidia/Cosmos-Reason2-2B, then run with -e HF_HOME=/weights/hf-cache), or
      pass -e HF_TOKEN for an account that has accepted the terms. Note
      HF_HUB_CACHE rather than HF_HOME for the download: HF_HOME moves the
      token too, which makes the download unauthenticated and the gate then
      rejects it. INSTRUCTIONS.md §0 has both routes.
  download_gb: 12.6
  # The checkpoint is stored fp32 (3 safetensors shards, 12.58 GB) and cast to
  # bfloat16 at load, which is why it occupies about half that on the GPU. Size
  # the download and the disk against 12.6 GB, not against the 6 GB runtime
  # figure below.
  format: GR00T N1.7 safetensors checkpoint, fp32 on disk, bf16 at load
  verified: >-
    Repo exists, public, ungated, 19 files, 3 fp32 safetensors shards totalling
    12.58 GB, last updated 2026-09-03. Its declared modality config was read
    off the repo and matches components/policy/bct.py. NOT YET re-verified on
    hardware: scripts/contract_check.py and the closed-loop run in docs/ were
    both recorded against the previous checkpoint, and are being re-run.
  description: >-
    GR00T N1.7 finetuned on Dex1 IKEA table assembly from a fixed standing
    pose, embodiment tag `new_embodiment`. 3 camera views (cam_left_high,
    cam_left_wrist, cam_right_wrist), 46-dim state, action horizon 40 at 30 Hz.
    The action space is arms + grippers only: arms predicted RELATIVE and
    restored to absolute by the processor, grippers ABSOLUTE, and no waist
    group at all. Three task prompts, not five. Run at 4 denoising steps --
    every open-loop number for this checkpoint was measured there.

# Peak GPU memory we expect on the Thor, of its 128 GB unified pool.
# MEASURED ON THE THOR, in this image: torch.cuda.max_memory_reserved() =
# 6.10 GiB (6.02 GiB allocated), PyTorch eager, batch 1, three views, 4
# denoising steps, horizon 40. Identical to what the same script reported on an
# A100, so the figure is not architecture-sensitive. 8 GB is that plus
# allocator slack.
# If we later switch to the TensorRT path this rises to roughly 14 GB (the
# engines are ~6 GB) and we will resubmit the manifest; we are not shipping it
# for onboarding, because 185 ms eager already clears the control budget.
peak_gpu_memory_gb: 8

# --- Everything below is context, not a required manifest field -------------

boundary:
  # Copied verbatim from the template at this commit and never edited.
  # scripts/check_boundary.sh re-verifies the checksums in docs/boundary.sha256.
  template_repo: https://github.com/iacevaltest/ikea_iros_submit
  template_commit: 2ae4eeb5fcbb5794a10357d427a59504849280e5

cameras:
  # Declared by the server in its metadata frame; the client filters to exactly
  # these. The checkpoint's `cam_left_high` was trained on cam_0 of the source
  # recording, which is the LEFT eye of the head stereo pair -- hence the stereo
  # key rather than the mono one. THIS NEEDS STEREO ENABLED FOR US; see
  # INSTRUCTIONS.md, "What we need from you".
  ego_view_left: cam_left_high
  left_wrist: cam_left_wrist
  right_wrist: cam_right_wrist
  fallback: >-
    If stereo is not live for our slot, start the server with
    --head-camera ego_view. It runs, but on an eye the checkpoint was not
    trained on, which costs accuracy silently.

control:
  # Tool offset, in metres along the wrist_yaw link's local +x. TWO values, and
  # they are not interchangeable -- see INSTRUCTIONS.md §6.2.
  action_ee_offset_m: 0.0         # what we PUBLISH. The organizer's IK targets
                                  # the bare wrist_yaw_link origin (confirmed
                                  # 2026-09-03, reversing their 08-28 answer).
  state_ee_offset_m: 0.05         # what the MODEL READS. A property of the
                                  # checkpoint: its left_eef/right_eef state
                                  # blocks were computed with this during
                                  # training, so it must never track the value
                                  # above. The server declares both in its
                                  # metadata frame.
  ee_frame: pelvis                # FK with the measured waist. Confirmed by the
                                  # organizer's own IK replay: 100% accept at
                                  # ~0.0000 residual, at a run where |waist|
                                  # median 0.228 rad put the pelvis and torso
                                  # frames 7.4 cm apart.
  ready_move: true                # Before the policy runs, the upper body ramps
                                  # to this subtask's recorded start pose: jaws,
                                  # 1 s dwell, then arms at 0.35 rad/s (0.75-1.32
                                  # rad, 13-26 cm of EE travel). ~4 s, 15 s
                                  # timeout. The 2026-09-03 dry run ran ~1.0 rad
                                  # away from that pose for 11.4 minutes. Legs
                                  # and waist are NOT touched -- no channel --
                                  # and were outside the training envelope for
                                  # 100% of that run; see INSTRUCTIONS.md 5.
                                  # Disable with --no-ready-move, no rebuild.
  model_horizon_rows: 40          # 1.33 s of trajectory at 30 Hz
  executed_rows_per_inference: 16 # 0.5 s of trajectory, then replan
  published_row_hz: 50            # model rows resampled in joint space
  measured_publish_period_ms: 304 # MEASURED ON THE REAL ROBOT, 2026-09-03 dry
                                  # run: 2,222 chunks over 11.4 min, median 304
                                  # ms between publishes (p10 297, p90 323, max
                                  # 350), no gap over 500 ms. State arrived at
                                  # 48.6 Hz, cameras at 29.5 Hz.
  measured_round_trip_ms: 190     # Orin client -> Thor -> chunk in hand, closed
                                  # loop from the digest images: 184-199 ms
                                  # against 182-187 ms of inference, so the link
                                  # adds about 10 ms. 320-340 ms of motion
                                  # published per cycle, ~150 ms ahead of the
                                  # next inference. docs/integration_thor_orin.log
  measured_inference_ms: 185      # on our Thor, in this image: 182/184/187 after
                                  # a 1224 ms warmup. PyTorch eager, 4 denoising
                                  # steps, batch 1, three 480x640 views.
  observation_encoding: jpeg      # quality 85, --jpeg-quality on the client
                                  # Three 480x640x3 frames are 2.76 MB raw. On
                                  # our own Thor<->Orin link that cost ~330 ms of
                                  # round trip -- more than the policy itself --
                                  # leaving 1 of 26 published rows alive. The
                                  # cause was a link negotiated at 100 Mb/s on
                                  # the Thor side: 22.1 Mbit / 100 Mbit/s is
                                  # 221 ms before any framing overhead.
                                  # JPEG takes the observation to roughly a
                                  # twentieth, i.e. ~12 ms even at 100 Mb/s, so
                                  # the sizing above holds whatever your link
                                  # negotiates. The server accepts raw arrays
                                  # too; it is a client-side flag.
  # Why 16 and not 8: the client drops the leading rows that inference latency
  # has already overtaken, and what survives has to last until the next chunk
  # lands. At 185 ms, 8 model rows become 12 published rows, 9 of which are
  # stale on arrival -- 60 ms of motion per 185 ms cycle, so the controller
  # would hold its last command two thirds of the time. 16 rows become 26, of
  # which 17 survive: 340 ms of motion per cycle, comfortably ahead of the next
  # inference. The cost is accuracy deeper into the chunk, which is the right
  # trade against a robot that stutters two thirds of the time. For this
  # checkpoint only the 1-8 row window has been scored (arm MAE 1.45 deg,
  # wrist 11.8 mm over 697 held-out windows); the 16- and 40-row scan that
  # justified this number on the previous checkpoint has not been re-run.
  locomotion: >-
    navigate_cmd, base_height_cmd and torso_rpy are published as zeros. The
    checkpoint predicts no locomotion command and no waist at all -- the waist
    is in its state but not in its action space -- so the whole-body controller
    keeps those degrees of freedom.
